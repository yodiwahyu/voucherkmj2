<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Cek Voucher KMJ2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f5fb; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --primary:#2563eb; --primary-d:#1d4ed8; --cell:#f8fafc;
    --ok:#15803d; --ok-bg:#dcfce7; --ok-line:#86efac;
    --bad:#b91c1c; --bad-bg:#fee2e2; --bad-line:#fca5a5;
    --warn:#a16207; --warn-bg:#fef3c7;
    --leave:#1d4ed8; --leave-bg:#dbeafe;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1020; --card:#151b2e; --text:#e8edf7; --muted:#94a3b8; --line:#26304a;
      --primary:#3b82f6; --primary-d:#2563eb; --cell:#1b2238;
      --ok:#86efac; --ok-bg:#12351f; --ok-line:#1f6b3a;
      --bad:#fca5a5; --bad-bg:#3b1416; --bad-line:#7f2a2e;
      --warn:#fcd34d; --warn-bg:#3a2d0b;
      --leave:#93c5fd; --leave-bg:#14284d;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;padding-bottom:max(24px,env(safe-area-inset-bottom));line-height:1.45}
  .hero{background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 55%,#0ea5e9 100%);color:#fff;
    padding:calc(28px + env(safe-area-inset-top)) 20px 78px;text-align:center}
  .hero .badge{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.18);
    display:grid;place-items:center;margin:0 auto 12px;backdrop-filter:blur(6px)}
  .badge img{display:none;height:64px;width:auto;max-width:240px;object-fit:contain}
  .hero .badge.has-logo{width:auto;height:auto;padding:0;background:none;border-radius:0;box-shadow:none;backdrop-filter:none}
  .hero .badge.has-logo svg{display:none}
  .hero .badge.has-logo img{display:block}
  .hero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.2px}
  .hero p{margin:6px 0 0;font-size:14px;opacity:.9}
  main{max-width:520px;margin:-54px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;border:1px solid var(--line)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .input-wrap{position:relative}
  .input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  input[type=text]{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--cell);
    color:var(--text);font:600 18px Inter,sans-serif;padding:0 16px 0 44px;outline:none;transition:.15s;letter-spacing:.3px}
  input[type=text]:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.15)}
  .btn{width:100%;height:54px;border:0;border-radius:14px;background:var(--primary);color:#fff;font:700 16px Inter,sans-serif;
    margin-top:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s}
  .btn:active{transform:scale(.985);background:var(--primary-d)}
  .btn[disabled]{opacity:.7;cursor:default}
  .spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center}
  .hidden{display:none!important}

  .status{border-radius:18px;padding:20px 16px;text-align:center;border:1.5px solid}
  .status.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .status.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
  .status .ic{width:60px;height:60px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff}
  .status.ok .ic{background:#16a34a}.status.bad .ic{background:#dc2626}
  .status h2{margin:0;font-size:19px;font-weight:800}
  .status p{margin:6px 0 0;font-size:13.5px;opacity:.95}
  .reasons{list-style:none;margin:14px 0 0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
  .reasons li{background:rgba(255,255,255,.55);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--text)}
  @media (prefers-color-scheme: dark){.reasons li{background:rgba(0,0,0,.25)}}
  .reasons b{color:var(--bad)}
  .note{margin-top:12px;font-size:12.5px;background:var(--warn-bg);color:var(--warn);padding:9px 12px;border-radius:12px;text-align:left}

  .sec-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .info{display:grid;grid-template-columns:110px 1fr;gap:10px 8px;font-size:14px;align-items:center}
  .info dt{color:var(--muted);margin:0}.info dd{margin:0;font-weight:600;word-break:break-word}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}

  select{height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--cell);color:var(--text);
    font:600 13px Inter,sans-serif;padding:0 10px;outline:none}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow div{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
  .dow div:nth-child(n+6){color:var(--bad)}
  .cell{min-height:54px;border-radius:10px;background:var(--cell);padding:4px 3px 5px;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;border:1px solid transparent}
  .cell.empty{background:transparent}
  .cell .n{font-size:11px;font-weight:600;color:var(--muted);align-self:flex-start;padding-left:3px}
  .cell.today{border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.2)}
  .chip{font-size:10px;font-weight:800;padding:2px 5px;border-radius:6px;min-width:28px;text-align:center;letter-spacing:.2px}
  .chip.none{color:var(--muted);font-weight:500;opacity:.6}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.nw{background:var(--warn-bg);color:var(--warn)}
  .chip.bad{background:var(--bad-bg);color:var(--bad)}
  .chip.leave{background:var(--leave-bg);color:var(--leave)}
  .chip.other{background:var(--line);color:var(--text)}
  .cell.flag{border-color:var(--bad-line)}

  details summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details summary::-webkit-details-marker{display:none}
  details[open] summary .chev{transform:rotate(180deg)}
  .chev{transition:.2s}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .legend div{font-size:12px;background:var(--cell);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
  .legend .chip{flex:none}

  .error{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line);padding:12px 14px;border-radius:14px;font-size:14px;font-weight:500}
  .notfound{text-align:center;padding:10px 4px}
  .notfound h3{margin:8px 0 4px;font-size:17px}.notfound p{margin:0;color:var(--muted);font-size:14px}
  footer{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 4px}
  footer a{color:var(--muted)}
  .skeleton{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--line),var(--cell),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  @media (max-width:360px){.info{grid-template-columns:90px 1fr}.cell{min-height:50px}}
</style>
</head>
<body>
  <header class="hero">
    <div class="badge" id="badge">
      <img id="logo" alt="Logo perusahaan" decoding="async">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v6a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2z"/><path d="M13 7v10" stroke-dasharray="2 2.5"/></svg>
    </div>
    <h1>PT Kanindo Makmur Jaya 2</h1>
    <p>Cek Status Voucher Reward Zero Absensi</p>
  </header>

  <main>
    <form class="card" id="form" autocomplete="off">
      <label for="nik">NIK Karyawan</label>
      <div class="input-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.5 1.7-2 3-2s2.4.5 3 2M15 9h3M15 13h3"/></svg>
        <input type="text" id="nik" placeholder="Contoh: 0225010012" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <button class="btn" id="btn" type="submit"><span id="btnText">Cek Status Voucher</span></button>
      <div class="hint">Masukkan NIK untuk melihat apakah Anda berhak voucher bulan ini</div>
    </form>

    <div id="result" class="hidden" style="display:flex;flex-direction:column;gap:14px"></div>
  </main>

  <footer>HRD · Voucher Indomaret · <a href="admin.html">Admin</a></footer>

<script src="config.js"></script>
<script>
(function(){
  var API = (window.APP_CONFIG||{}).API_URL;
  (function(){
    var u=(window.APP_CONFIG||{}).LOGO_URL; if(!u) return;
    var img=document.getElementById('logo');
    img.onload=function(){
      document.getElementById('badge').classList.add('has-logo');
      var l=document.createElement('link'); l.rel='icon'; l.href=u; document.head.appendChild(l);
    };
    img.onerror=function(){ img.remove(); };
    img.src=u;
  })();
  var MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var DOW=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
  var LEGEND=[['K','Kerja'],['NW','Not Work Day'],['HW','Holiday Working'],['SH','Shift'],['A','Alpha'],['T','Terlambat'],['PC','Pulang Cepat'],['I','Ijin'],['IT','Ijin Terlambat'],['IPC','Ijin Pulang Cepat'],['SAK','Sakit Tanpa Surat Dokter'],['CSD','Cuti Surat Dokter'],['CTH','Cuti Tahunan'],['CMN','Cuti Menikah'],['CAN','Cuti Anak Nikah'],['IR','Cuti Anak Khitanan'],['CIM','Cuti Istri Melahirkan'],['CML','Cuti Melahirkan'],['CG','Cuti Keguguran'],['CH','Cuti Haid'],['CK','Cuti Kematian']];
  var LABEL={}; LEGEND.forEach(function(x){LABEL[x[0]]=x[1];});
  LABEL.CKG='Cuti Keguguran';
  var BAD={T:1,PC:1,I:1,IT:1,IPC:1,SAK:1,CSD:1,CTH:1,CMN:1,CAN:1,IR:1,CIM:1,CML:1,CG:1,CKG:1,CH:1,CK:1,A:1};
  var LEAVE={};

  var $=function(s){return document.querySelector(s);};
  var form=$('#form'), nikEl=$('#nik'), btn=$('#btn'), btnText=$('#btnText'), result=$('#result');
  var lastNik='', busy=false;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function periodLabel(p){var a=p.split('-');return MONTHS[+a[1]-1]+' '+a[0];}
  function codeClass(c){if(!c)return 'none';if(BAD[c])return 'bad';if(LEAVE[c])return 'leave';if(c==='K'||c==='SH'||c==='HW')return 'ok';if(c==='NW')return 'nw';return 'other';}

  function setBusy(b){
    busy=b; btn.disabled=b;
    btnText.innerHTML=b?'<span class="spin"></span> Memeriksa...':'Cek Status Voucher';
  }
  function showSkeleton(){
    result.classList.remove('hidden');
    result.innerHTML='<div class="card"><div class="skeleton" style="height:90px;margin-bottom:14px"></div><div class="skeleton" style="width:60%;margin-bottom:10px"></div><div class="skeleton" style="width:80%;margin-bottom:10px"></div><div class="skeleton" style="width:50%"></div></div>';
  }
  function showError(msg){
    result.classList.remove('hidden');
    result.innerHTML='<div class="error">'+esc(msg)+'</div>';
  }

  async function api(params){
    if(!API||API.indexOf('PASTE_')===0) throw new Error('API belum dikonfigurasi. Isi API_URL di config.js.');
    var ctrl=new AbortController(); var t=setTimeout(function(){ctrl.abort();},30000);
    try{
      var res=await fetch(API+'?'+new URLSearchParams(params).toString(),{signal:ctrl.signal});
      if(!res.ok) throw new Error('Server mengembalikan status '+res.status);
      return await res.json();
    }catch(e){
      if(e.name==='AbortError') throw new Error('Server terlalu lama merespons. Coba lagi.');
      if(e instanceof TypeError) throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet Anda.');
      throw e;
    }finally{clearTimeout(t);}
  }

  async function check(nik,periode){
    setBusy(true); showSkeleton();
    try{
      var p={action:'check',nik:nik}; if(periode) p.periode=periode;
      var d=await api(p);
      if(!d.ok) return showError(d.error||'Terjadi kesalahan.');
      render(d);
    }catch(e){ showError(e.message); }
    finally{ setBusy(false); }
  }

  function render(d){
    result.classList.remove('hidden');
    if(!d.found){
      var extra=(d.nikPeriods&&d.nikPeriods.length)?'<p style="margin-top:8px">NIK ini ada pada periode: '+d.nikPeriods.map(periodLabel).map(esc).join(', ')+'.</p>':'<p style="margin-top:8px">Pastikan NIK yang dimasukkan sudah benar atau hubungi HRD.</p>';
      result.innerHTML='<div class="card notfound"><div style="font-size:38px">🔍</div><h3>NIK tidak ditemukan</h3><p>Tidak ada data untuk periode '+esc(periodLabel(d.periode))+'.</p>'+extra+periodSelect(d)+'</div>';
      bindPeriod(); return;
    }
    var e=d.employee, eligible=d.eligible;
    var now=new Date(), curP=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    var reasons='';
    if(!eligible){
      var items=[];
      if(e.hasSP) items.push('Memiliki Surat Peringatan: <b>'+esc(e.sp)+'</b>');
      var g={};
      d.violations.forEach(function(v){(g[v.code]=g[v.code]||[]).push(v.day);});
      Object.keys(g).forEach(function(c){items.push((LABEL[c]?esc(LABEL[c]):'Kode')+' (<b>'+esc(c)+'</b>) pada tanggal '+g[c].join(', '));});
      if(d.partialMonth&&d.partial){
        var pt=d.partial;
        if(pt.blockedBefore) items.push('Mulai bekerja pada tanggal <b>'+(pt.before+1)+'</b>, setelah hari kerja pertama bulan ini');
        if(pt.blockedAfter) items.push('Tidak tercatat setelah tanggal <b>'+(d.daysInMonth-pt.after)+'</b> (keluar di tengah bulan)');
      }
      reasons='<ul class="reasons">'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>';
    }
    var note=(eligible&&d.periode===curP)?'<div class="note">⏳ Bulan ini belum berakhir. Status dapat berubah jika ada keterlambatan atau pulang cepat sampai akhir bulan.</div>':'';
    var status=eligible
      ?'<div class="status ok"><div class="ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>Selamat! Anda berhak mendapatkan VOUCHER</h2><p>Periode '+esc(periodLabel(d.periode))+'</p>'+note+'</div>'
      :'<div class="status bad"><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div><h2>Maaf, Anda belum berhak mendapatkan voucher</h2><p>Periode '+esc(periodLabel(d.periode))+'</p>'+reasons+'</div>';

    var info='<div class="card"><h3 class="sec-title">Informasi Karyawan</h3><dl class="info" style="margin:0">'
      +'<dt>NIK</dt><dd>'+esc(e.nik)+'</dd>'
      +'<dt>Nama</dt><dd>'+esc(e.nama)+'</dd>'
      +'<dt>Department</dt><dd>'+esc(e.department)+'</dd>'
      +'<dt>Status SP</dt><dd>'+(e.hasSP?'<span class="pill bad">'+esc(e.sp)+'</span>':'<span class="pill ok">Tidak Ada SP</span>')+'</dd></dl></div>';

    var cal='<div class="card"><h3 class="sec-title"><span>Kalender Kehadiran</span>'+periodSelect(d,true)+'</h3>'+calendar(d)+'</div>';

    var leg='<div class="card"><details><summary>Keterangan Kode Absensi<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></summary><div class="legend">'
      +LEGEND.map(function(x){return '<div><span class="chip '+codeClass(x[0])+'">'+x[0]+'</span><span>'+esc(x[1])+'</span></div>';}).join('')+'</div></details></div>';

    result.innerHTML=status+info+cal+leg;
    bindPeriod();
    result.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function periodSelect(d,compact){
    if(!d.periods||d.periods.length<2){return compact?'<span class="pill" style="background:var(--leave-bg);color:var(--leave)">'+esc(periodLabel(d.periode))+'</span>':'';}
    return '<select id="periodSel" aria-label="Pilih periode">'+d.periods.map(function(p){return '<option value="'+esc(p)+'"'+(p===d.periode?' selected':'')+'>'+esc(periodLabel(p))+'</option>';}).join('')+'</select>';
  }
  function bindPeriod(){
    var s=$('#periodSel'); if(!s) return;
    s.addEventListener('change',function(){ if(!busy&&lastNik) check(lastNik,s.value); });
  }

  function calendar(d){
    var a=d.periode.split('-'), y=+a[0], m=+a[1];
    var dim=new Date(y,m,0).getDate();
    var off=(new Date(y,m-1,1).getDay()+6)%7;
    var now=new Date(), isCur=(now.getFullYear()===y&&now.getMonth()+1===m);
    var bad={}; d.violations.forEach(function(v){bad[v.day]=1;});
    var h='<div class="dow">'+DOW.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div><div class="grid">';
    for(var i=0;i<off;i++) h+='<div class="cell empty"></div>';
    for(var day=1;day<=dim;day++){
      var c=d.days[day-1]||'';
      h+='<div class="cell'+(isCur&&now.getDate()===day?' today':'')+(bad[day]?' flag':'')+'"><span class="n">'+day+'</span><span class="chip '+codeClass(c)+'">'+(c?esc(c):'·')+'</span></div>';
    }
    return h+'</div>';
  }

  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var nik=nikEl.value.trim();
    if(!nik){ nikEl.focus(); showError('Silakan masukkan NIK terlebih dahulu.'); return; }
    if(busy) return;
    lastNik=nik; nikEl.blur();
    check(nik,'');
  });
})();
</script>
</body>
</html>
